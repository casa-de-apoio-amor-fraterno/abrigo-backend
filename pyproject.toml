[project]
name = "abrigo-backend"
version = "0.1.0"
description = "Backend (FastAPI) do sistema de gestão da Casa de Apoio Amor Fraterno"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.14",
  "bcrypt>=4.2",
  "pyjwt>=2.9",
  "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.7",
]
# Só usado pelos scripts de migração de dados (leitura do MySQL legado),
# não pela aplicação em si — ver docs/migracao-postgres.md.
migracao = ["pymysql>=1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "B008",  # Depends(...) como valor default é o padrão idiomático do FastAPI.
  "DTZ011",  # date.today() é correto para colunas `date` (sem timezone) — não é datetime.
  "DTZ001",  # datetime() naive é correto aqui: as colunas datetime do MySQL legado não têm timezone.
]
